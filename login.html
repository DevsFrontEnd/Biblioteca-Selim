<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Biblioteca Selim</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body class="login">
  <header>
    <article class="header-pt1">
      <img src="imgs/Sjs.PNG" alt="Logo da Escola">

      <nav>
        <a href="index.html">
          <i class="fa-sharp fa-solid fa-house"></i>
          Página Inicial
        </a>
        <a href="catalogo.html">
          <i class="fa-sharp fa-solid fa-book-open"></i>
          Catálogo
        </a>
        <a href="emprestimo.html">
          <i class="fa-solid fa-lines-leaning"></i>
          Empréstimos
        </a>
        <a href="sobrenos.html">
            <i class="fa-solid fa-building-columns"></i>
            Sobre Nós
        </a>
      </nav>
    </article>

    <article class="header-pt2">
      <input type="search" placeholder="O que você procura?    🔍">
      <button><i class="fa-solid fa-user"></i></button>
      <a href="login.html" id="botao-login-header">Login</a>
    </article>
  </header>

  <main>
    <section class="bloco">
        <div class="bloco-pt1">
            <img src="imgs/cadastro e login/perfil.png" alt="livro">
            <h1>Login</h1>
            <p>Entre com seus dados para acessar sua conta</p>
        </div>
        <form class="form">
            <div class="campo">
                <i class="fa-regular fa-address-card"></i>
                <input type="text" name="campo-matricula" id="campo-nome" placeholder="Matrícula">
            </div>
            <div class="campo">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="campo-senha" id="campo-nome" placeholder="Senha">
            </div>
            <div class="campo botao-enviar">
                <input type="submit" name="campo-enviar" id="campo-nome">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </form>
        <div class="bloco-pt3">
            <p>Ainda não tem uma conta? </p>
            <a href="cadastro.html">Cadastrar.</a>
        </div>
    </section>
  </main>

  <footer>
    <section class="footer">
      <p>SJS - E.E Selim José de Salles | Biblioteca Escolar</p>
      <article>
        <p>Redes Sociais:</p>
        <nav>
          <a href="#"><i class="fa-regular fa-envelope"></i></a>
          <a href="#"><i class="fa-brands fa-facebook"></i></a>
          <a href="#"><i class="fa-brands fa-instagram"></i></a>
          <a href="#"><i class="fa-brands fa-youtube"></i></a>
        </nav>
      </article>
      <p>
        <i class="fa-sharp fa-solid fa-book-open"></i>Mais que livros, é <strong>conhecimento</strong>.
      </p>
    </section>
  </footer>
  <script src="script.js"></script>
</body>

</html>
