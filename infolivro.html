<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo - Biblioteca Selim</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <section class="header">
            <div class="escola">
                <img src="imgs/iconeselim.png" alt="Logo da escola">
                <h1 class="aling">E.E Selim José de Salles</h1>
            </div>
            <div class="titulo-header">
                <div class="abrir">
                    <a href="#" class="botao-abrir-menu" onclick="abrirmenu()">☰</a>
                </div>
                    <h2>Feira Tecnica</h2>
                <nav class="menu">
                    <a href="#" class="botao-fechar-menu" onclick="fecharmenu()">✕</a>
                    <a href="index.html">Início</a>
                    <a href="catalogo.html">Catalogo</a>
                </nav>
            </div>
        </section>
    </header>

    <main>
        <section class="info-livro">
            <img src="#" alt="Capa do livro" id="capa">
            <article>
                <h3 id="nome"></h3>
                <h4 id="autor"></h4>
                <p id="isbn"></p>
                <p id="editora"></p>
                <p id="paginas"></p>
                <p id="genero"></p>
                <button>Emprestar</button>
            </article>
        </section>
    </main>

    <footer>
        <section>
            <article class="inicio-footer">
                <div class="escola-footer">
                    <img src="imgs/iconeselim.png" alt="Logo da escola">
                    <h1>SJS</h1>
                </div>
                <p>E.E Selim José de Salles</p>
            </article>
            <article class="redes-sociais">
                <p>Redes Sociais:</p>
                <a href="#"><img src="imgs/logofacebook.png" alt="logo facebook"></a>
                <a href="https://www.instagram.com/eeselimjosedesalles?stkn=cmJ1bHMyZ3A2M2c1"><img src="imgs/logoinstagram.png" alt="logo instagram"></a>
                <a href="#"><img src="imgs/logoemail.png" alt="logo email"></a>
            </article>
        </section>
    </footer>
</body>
</html>
